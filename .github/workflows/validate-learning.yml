name: Validate AI4Impact release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: ap-south-1
      NEXT_PUBLIC_API_URL: https://ke8dywmhil.execute-api.ap-south-1.amazonaws.com
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-south-1_kc1sfOoEG
      NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: 40faprqjpcc6q0pfkdkcrd8p5v
      NEXT_PUBLIC_COGNITO_REGION: ap-south-1
      NEXT_PUBLIC_COGNITO_DOMAIN: pilearn-767491588787
      NEXT_PUBLIC_APP_URL: https://main.d16744ddqs159z.amplifyapp.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
      - name: Backend tests
        run: |
          python -m pip install -r requirements.txt pytest pip-audit
          # Disputed weak-HMAC-key advisory: this service accepts only Cognito RS256.
          python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2025-183
          python -m pytest tests -q
      - name: Package Lambda functions
        run: bash scripts/build_lambdas.sh
      - name: Terraform validation
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - name: Admin production build
        working-directory: admin-dashboard
        run: |
          npm ci
          npm audit --omit=dev
          npm audit --audit-level=high
          npm run build
      - name: Admin browser regressions
        working-directory: admin-dashboard
        run: |
          npx playwright install --with-deps chromium
          npm run start -- --port 3100 > /tmp/admin-browser-server.log 2>&1 &
          ADMIN_QA_PID=$!
          trap 'kill "$ADMIN_QA_PID"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://localhost:3100/login > /dev/null
          npx playwright test tests/assisted-enrollment.spec.ts tests/video-analytics.spec.ts tests/embedded-login.spec.ts tests/workspace-staff.spec.ts tests/programme.spec.ts tests/programme-live.spec.ts --workers=1 --reporter=line
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - name: Landing static production build
        working-directory: landing-page
        env:
          AMPLIFY_LANDING_EXPORT: 'true'
        run: |
          npm ci
          # Runtime: block every advisory. Build tooling: report all, block high/critical.
          npm audit --omit=dev
          npm audit --audit-level=high
          npm run build


      - name: Webinar campaign browser regressions
        run: |
          npm ci --prefix admin-dashboard
          cd admin-dashboard
          npx playwright install --with-deps chromium
          python3 -m http.server 3004 --bind 127.0.0.1 --directory ../landing-page/out > /tmp/landing-webinar-server.log 2>&1 &
          WEBINAR_QA_PID=$!
          trap 'kill "$WEBINAR_QA_PID"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://localhost:3004 > /dev/null
          QA_LANDING_URL=http://localhost:3004 npx playwright test tests/webinar-campaign.spec.ts --workers=1 --reporter=line

  student-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Student app typecheck and static web export
        working-directory: mobile-app
        env:
          EXPO_PUBLIC_API_URL: https://ke8dywmhil.execute-api.ap-south-1.amazonaws.com
          EXPO_PUBLIC_COGNITO_USER_POOL_ID: ap-south-1_kc1sfOoEG
          EXPO_PUBLIC_COGNITO_APP_CLIENT_ID: 40faprqjpcc6q0pfkdkcrd8p5v
          EXPO_PUBLIC_COGNITO_REGION: ap-south-1
        run: |
          npm ci
          # Remaining upstream node-forge advisories are confined to Expo build tooling.
          # Keep critical advisories blocking while a patched upstream release is awaited.
          npm audit --omit=dev --audit-level=critical
          npm run typecheck
          npm run test:resilience
          npm run export:web
      - name: Student browser regressions
        working-directory: mobile-app
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

  programme-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: programme_test
          POSTGRES_USER: programme
          POSTGRES_PASSWORD: programme-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U programme -d programme_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROGRAMME_TEST_DSN: host=127.0.0.1 port=5432 dbname=programme_test user=programme password=programme-test-only
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_programme_integration.py -q
