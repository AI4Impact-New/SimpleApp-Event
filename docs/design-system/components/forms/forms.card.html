<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.AI4ImpactDesignSystem_a75035;

const {Input,Select,Checkbox,ChoiceOption}=NS;
function App(){const [sel,setSel]=React.useState(0);const opts=['Ship AI into real businesses','Build data platforms and pipelines','Turn data into decisions'];
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',minHeight:330}}>
 <div style={{background:'var(--surface-dark-raised)',padding:20,display:'flex',flexDirection:'column',gap:14}}>
  <Input label="Full name"/>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}><Input label="Email"/><Input label="Phone / WhatsApp" defaultValue="+91"/></div>
  <Select label="I'm interested in" options={['Not sure yet — help me choose','Forward Deployed AI Engineer']}/>
  <Checkbox>I agree to be contacted by AI4Impact via call, SMS, email and WhatsApp.</Checkbox>
 </div>
 <div style={{background:'var(--surface-alt)',padding:20,display:'flex',flexDirection:'column',gap:9}}>
  <span style={{font:'400 13px/1 var(--font-body)',color:'var(--text-body)',marginBottom:6}}>What do you want to be doing in a year?</span>
  {opts.map((o,i)=><ChoiceOption key={o} selected={sel===i} onClick={()=>setSel(i)}>{o}</ChoiceOption>)}
 </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
