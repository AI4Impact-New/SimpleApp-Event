<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff;font-family:var(--font-body);color:var(--text-strong)}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-body)}.v{font:400 11px/1.2 var(--font-body);color:var(--text-muted)}.row{display:flex;gap:16px;padding:20px 24px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--navy-900)"></div><span class="n">Navy 900</span><span class="v">Dark sections, footer</span></div><div class="sw"><div class="chip" style="background:var(--navy-800)"></div><span class="n">Navy 800</span><span class="v">Ink, primary button</span></div><div class="sw"><div class="chip" style="background:var(--navy-600)"></div><span class="n">Navy 600</span><span class="v">Raised cards and lines on dark</span></div></div></body></html>
