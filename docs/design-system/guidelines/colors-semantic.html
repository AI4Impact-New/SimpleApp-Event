<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="Use these in components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff;font-family:var(--font-body);color:var(--text-strong)}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-body)}.v{font:400 10px/1.2 var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px;padding:20px 24px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;height:170px">
<div style="background:var(--surface-page);padding:18px 22px;display:flex;flex-direction:column;gap:8px">
<span style="font:600 16px/1 var(--font-display);color:var(--text-strong)">--text-strong</span><span style="font:400 13px/1 var(--font-body);color:var(--text-body)">--text-body on --surface-page</span><span style="font:400 13px/1 var(--font-body);color:var(--text-muted)">--text-muted</span><span style="font:400 12px/1 var(--font-mono);color:var(--text-accent)">--text-accent</span><div style="height:1px;background:var(--border-default);margin:4px 0"></div><span style="font:400 11px/1 var(--font-mono);color:var(--text-muted)">--border-default</span></div>
<div style="background:var(--surface-dark);padding:18px 22px;display:flex;flex-direction:column;gap:8px">
<span style="font:600 16px/1 var(--font-display);color:var(--text-on-dark)">--text-on-dark</span><span style="font:400 13px/1 var(--font-body);color:var(--text-on-dark-body)">--text-on-dark-body on --surface-dark</span><span style="font:400 13px/1 var(--font-body);color:var(--text-on-dark-muted)">--text-on-dark-muted</span><span style="font:400 12px/1 var(--font-mono);color:var(--text-on-dark-accent)">--text-on-dark-accent</span><div style="height:1px;background:var(--border-dark-strong);margin:4px 0"></div><span style="font:400 11px/1 var(--font-mono);color:var(--text-on-dark-muted)">--border-dark</span></div></div></body></html>
