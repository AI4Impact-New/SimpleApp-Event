<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff;font-family:var(--font-body);color:var(--text-strong)}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}.n{font:500 12px/1.2 var(--font-body)}.v{font:400 11px/1.2 var(--font-body);color:var(--text-muted)}.row{display:flex;gap:16px;padding:20px 24px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--slate-600)"></div><span class="n">Slate 600</span><span class="v">Body text</span></div><div class="sw"><div class="chip" style="background:var(--slate-200)"></div><span class="n">Slate 200</span><span class="v">Borders and dividers</span></div><div class="sw"><div class="chip" style="background:var(--slate-50)"></div><span class="n">Slate 50</span><span class="v">Page background</span></div></div></body></html>
