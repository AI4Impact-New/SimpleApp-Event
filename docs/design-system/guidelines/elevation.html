<!-- @dsCard group="Spacing" viewport="700x180" name="Borders & elevation" subtitle="Flat 1px borders; shadow only on floating artefacts" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-strong)}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-body)}.v{font:400 10px/1.2 var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px;padding:20px 24px}</style></head><body><div style="padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;background:var(--surface-page)"><div style="height:110px;border-radius:20px;background:#fff;border:1px solid var(--border-default);padding:14px"><span class="v">default card · 1px slate-200</span></div><div style="height:110px;border-radius:20px;background:#fff;border:2px solid var(--teal-600);padding:14px"><span class="v">highlighted · 2px teal-600</span></div><div style="height:110px;border-radius:20px;background:var(--cream-50);box-shadow:var(--shadow-float);padding:14px"><span class="v">--shadow-float (certificate)</span></div></div></body></html>
