<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff;font-family:var(--font-body);color:var(--text-strong)}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-body)}.v{font:400 10px/1.2 var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px;padding:20px 24px}</style></head><body><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><div class="row" style="justify-content:space-between;align-items:center;height:150px"><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="arrow-right" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">arrow-right</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="arrow-up-right" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">arrow-up-right</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="log-in" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">log-in</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="circle-play" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">circle-play</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="hammer" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">hammer</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="messages-square" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">messages-square</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="calendar-clock" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">calendar-clock</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="database" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">database</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="check" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">check</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-strong)"><i data-lucide="chevron-right" style="width:22px;height:22px"></i><span class="v" style="font-size:9px">chevron-right</span></div></div><script>lucide.createIcons()</script></body></html>
