<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff;font-family:var(--font-body);color:var(--text-strong)}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-body)}.v{font:400 10px/1.2 var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px;padding:20px 24px}</style></head><body><div style="display:flex;flex-direction:column;height:150px"><div style="flex:1;background:var(--surface-page);padding:14px 60px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div style="border:1px solid var(--border-default);border-radius:10px;background:#fff"></div><div style="border:1px solid var(--border-default);border-radius:10px;background:#fff"></div><div style="border:1px solid var(--border-default);border-radius:10px;background:#fff"></div></div><div style="flex:1;background:var(--surface-alt);padding:14px 60px;display:flex;align-items:center"><span class="v">--surface-alt band · --section-pad-y 120px · --container 1216px</span></div><div style="flex:1;background:var(--bg-hero)"></div></div></body></html>
