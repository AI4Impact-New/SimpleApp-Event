<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff;font-family:var(--font-body);color:var(--text-strong)}*{box-sizing:border-box}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:500 12px/1.2 var(--font-body)}.v{font:400 10px/1.2 var(--font-mono);color:var(--text-muted)}.row{display:flex;gap:10px;padding:20px 24px}</style></head><body><div style="padding:22px 24px;display:flex;align-items:flex-end;gap:28px"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--teal-100);border:1px solid var(--teal-500)"></div><span class="n">4</span><span class="v">Icon gap</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--teal-100);border:1px solid var(--teal-500)"></div><span class="n">8</span><span class="v">Tight</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--teal-100);border:1px solid var(--teal-500)"></div><span class="n">16</span><span class="v">Card grid gap</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--teal-100);border:1px solid var(--teal-500)"></div><span class="n">24</span><span class="v">Card padding</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--teal-100);border:1px solid var(--teal-500)"></div><span class="n">48</span><span class="v">Block gap</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:var(--space-24);heigh
